name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # The same gate as local commits: ruff format --check, ruff check, mypy strict, pytest + coverage floor.
    # The default test run is offline (tests/synthetic.py); network and slow tests stay opt-in.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: ./scripts/check.sh
